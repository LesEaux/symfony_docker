# Local development stack. See README.md for initialization.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfonypass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  php:
    build:
      context: .
      target: development
    restart: unless-stopped
    volumes:
      - ./symfony:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./symfony:/var/www/html:ro
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: [tools]
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  mailer:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  vendor_data:
  var_data:
