map $uri $safe_request_uri {
    default $uri;
    ~^/reset-password/ /reset-password/[redacted];
}
log_format app '$remote_addr [$time_local] "$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    client_max_body_size 3m;
    root /var/www/html/public;
    index index.php;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log app;
}
