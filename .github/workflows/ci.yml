name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symfony
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, pdo_sqlite, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit
      - run: php bin/console lint:container
      - run: php bin/console lint:yaml config
      - run: php bin/console lint:twig templates
      - run: composer analyse
      - run: composer cs-check
      - run: php bin/phpunit
      - name: Validate MySQL migrations and schema
        env:
          DATABASE_URL: mysql://app:ci-app-password@127.0.0.1:3306/app?serverVersion=8.4.0&charset=utf8mb4
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target web -t vodableweb-web:ci .
